<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海缆故障传报系统</title>
<script>
  // 在页面绘制前恢复主题，避免刷新时先闪出另一套配色。
  (() => {
    let theme = 'light';
    try {
      theme = localStorage.getItem('subsentry-theme') || 'light';
    } catch (_) {}
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
  })();

  function applyTheme(theme, persist = true) {
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
    if (persist) {
      try { localStorage.setItem('subsentry-theme', theme); } catch (_) {}
    }
    const button = document.getElementById('theme-toggle');
    if (button) {
      const nextName = theme === 'light' ? '夜间模式' : '日间模式';
      button.setAttribute('aria-label', `切换至${nextName}`);
      button.setAttribute('title', `切换至${nextName}`);
    }
  }

  function toggleTheme() {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  }

  document.addEventListener('DOMContentLoaded', () => {
    applyTheme(document.documentElement.dataset.theme || 'light', false);
  });
</script>
<script src="/assets/vendor/tailwindcss.js"></script>
<script defer src="/assets/vendor/alpine.min.js"></script>
<style>
  /* Alpine.js x-cloak: 在 JS 初始化前隐藏元素，防止闪烁 */
  [x-cloak] { display: none !important; }

  :root {
    --green: #059669;
    --red: #dc2626;
    --yellow: #d97706;
    --blue: #1677a8;
    --page: #f4f8fa;
    --page-deep: #e7f1f5;
    --card: rgba(255, 255, 255, .9);
    --surface: #f6fafb;
    --surface-strong: #edf5f7;
    --border: #d5e2e7;
    --border-soft: #e6eef1;
    --text: #162b36;
    --text-secondary: #4f6570;
    --text-muted: #748892;
    --text-faint: #9aacb4;
    --header: rgba(251, 254, 255, .9);
    --header-border: rgba(142, 169, 180, .3);
    --map-bg: #edf7f8;
    --map-coast: #b9cdd4;
    --map-ocean: #bfd8df;
    --landing-label: #176b91;
    --row-critical: rgba(220, 38, 38, .045);
    --shadow: 0 14px 38px rgba(46, 83, 96, .08), 0 2px 8px rgba(46, 83, 96, .04);
    --shadow-hover: 0 18px 44px rgba(46, 83, 96, .12);
  }

  html[data-theme="dark"] {
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --blue: #3b82f6;
    --page: #0f1117;
    --page-deep: #111827;
    --card: #1a1d27;
    --surface: #12151f;
    --surface-strong: #22263a;
    --border: #2e3347;
    --border-soft: #1e2132;
    --text: #e2e8f0;
    --text-secondary: #cbd5e1;
    --text-muted: #9ca3af;
    --text-faint: #6b7280;
    --header: rgba(20, 24, 36, .94);
    --header-border: #2e3347;
    --map-bg: #12151f;
    --map-coast: #2e3347;
    --map-ocean: #374151;
    --landing-label: #93c5fd;
    --row-critical: rgba(239, 68, 68, .04);
    --shadow: 0 12px 30px rgba(0, 0, 0, .18);
    --shadow-hover: 0 16px 38px rgba(0, 0, 0, .26);
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    min-height: 100vh;
    margin: 0;
    background:
      radial-gradient(circle at 12% 2%, rgba(24, 149, 170, .10), transparent 27rem),
      radial-gradient(circle at 88% 9%, rgba(22, 119, 168, .08), transparent 30rem),
      linear-gradient(145deg, var(--page), var(--page-deep));
    color: var(--text);
    font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: background .25s ease, color .2s ease;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .42;
    background-image:
      linear-gradient(rgba(79, 126, 140, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79, 126, 140, .035) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: linear-gradient(to bottom, black, transparent 72%);
  }
  html[data-theme="dark"] body::before { opacity: .14; }

  .site-header {
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 32px;
    background: var(--header);
    border-bottom: 1px solid var(--header-border);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .5);
    backdrop-filter: blur(18px);
  }
  html[data-theme="dark"] .site-header { box-shadow: none; }
  .brand-mark {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    color: #fff;
    background: linear-gradient(145deg, #138e9b, #17639a);
    box-shadow: 0 8px 20px rgba(23, 99, 154, .2);
  }
  .brand-mark svg { width: 23px; height: 23px; }
  .brand-title { color: var(--text); }
  .brand-subtitle { color: var(--text-muted); }
  .header-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .segment-count {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 11px;
    border: 1px solid rgba(22, 119, 168, .18);
    border-radius: 999px;
    color: #176b91;
    background: rgba(22, 119, 168, .07);
    font-size: 12px;
    font-weight: 600;
  }
  html[data-theme="dark"] .segment-count { color: #7dd3fc; background: rgba(59, 130, 246, .1); border-color: rgba(59, 130, 246, .25); }
  .segment-count-dot { width: 6px; height: 6px; border-radius: 50%; background: #13a184; box-shadow: 0 0 0 4px rgba(19, 161, 132, .1); }
  .theme-toggle {
    height: 34px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-secondary);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(46, 83, 96, .05);
    transition: transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .theme-toggle:hover { transform: translateY(-1px); border-color: var(--blue); }
  .theme-toggle svg { width: 15px; height: 15px; }
  .theme-light-content { display: inline-flex; align-items: center; gap: 7px; }
  .theme-dark-content { display: none; }
  html[data-theme="dark"] .theme-light-content { display: none; }
  html[data-theme="dark"] .theme-dark-content { display: inline-flex; align-items: center; gap: 7px; }

  .app-shell { position: relative; z-index: 1; }
  .main-grid { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover { box-shadow: var(--shadow-hover); }
  .surface-muted { background: var(--surface); border: 1px solid var(--border); }
  .input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    transition: border .2s, box-shadow .2s, background .2s;
  }
  .input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(22, 119, 168, .12); background: var(--card); }
  .input-uniform { height: 40px; }
  .btn-primary { background: linear-gradient(135deg, #148898, #176da1); color: #fff; border-radius: 8px; padding: 8px 20px; font-weight: 600; font-size: 14px; cursor: pointer; transition: transform .2s, box-shadow .2s; border: none; box-shadow: 0 6px 14px rgba(23, 109, 161, .18); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(23, 109, 161, .25); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-danger  { background: transparent; color: var(--red); border: 1px solid rgba(220, 38, 38, .45); border-radius: 7px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .btn-danger:hover { background: rgba(239,68,68,.1); }
  .btn-ghost   { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: border .2s, color .2s, background .2s; }
  .btn-ghost:hover { border-color: var(--blue); color: var(--blue); background: var(--card); }
  .tab-btn { padding: 7px 14px; border-radius: 6px 6px 0 0; font-size: 13px; cursor: pointer; border: 1px solid transparent; border-bottom: none; color: #6b7280; background: transparent; transition: all .2s; }
  .tab-btn.active { background: var(--surface-strong); color: var(--text); border-color: var(--border); margin-bottom: -1px; }
  .copy-area { font-family: "PingFang SC", "Microsoft YaHei", monospace; font-size: 13px; line-height: 1.75; white-space: pre-wrap; background: var(--surface); border: 1px solid var(--border-soft); border-radius: 9px; padding: 15px 17px; color: var(--text-secondary); }
  .impact-row-critical { background: var(--row-critical); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-broken  { background: rgba(220,38,38,.11);  color: var(--red); }
  .badge-primary { background: rgba(217,119,6,.12); color: var(--yellow); }
  .badge-backup  { background: rgba(22,119,168,.12); color: var(--blue); }
  .badge-suspect { background: rgba(147,51,234,.11); color: #7e22ce; }
  .badge-normal  { background: rgba(5,150,105,.11); color: var(--green); }
  .badge-ip      { background: rgba(5,150,105,.11); color: var(--green); }
  .badge-iepl    { background: rgba(217,119,6,.12); color: var(--yellow); }
  .badge-shanghai { background: rgba(8,145,178,.11); color: #087f8c; }
  html[data-theme="dark"] .badge-suspect { color: #a78bfa; }
  html[data-theme="dark"] .badge-shanghai { color: #22d3ee; }

  /* SVG 海缆线条动画 */
  .cable-line { stroke-width: 3; fill: none; stroke-linecap: round; transition: stroke .4s, stroke-width .3s; cursor: pointer; }
  .cable-line.normal { stroke: var(--green); }
  .cable-line.broken { stroke: var(--red); stroke-dasharray: 8 4; animation: dash 1s linear infinite; }
  .cable-line:hover  { stroke-width: 5; }
  @keyframes dash { to { stroke-dashoffset: -24; } }
  .cable-map { background: var(--map-bg); border: 1px solid var(--border-soft); border-radius: 10px; }
  .landing-dot { fill: var(--blue); }
  .tooltip-box { position: absolute; background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 10px 14px; font-size: 12px; color: var(--text); pointer-events: none; z-index: 50; min-width: 160px; box-shadow: var(--shadow-hover); }
  .timeline-event, .timeline-event-active { border: 1px solid var(--border); }
  .timeline-event { background: var(--surface); }
  .timeline-event-active { background: rgba(22, 119, 168, .10); border-color: var(--blue); box-shadow: inset 3px 0 0 var(--blue); }
  .segment-pill { transition: border-color .2s, background .2s, color .2s; }
  .segment-normal { border-color: var(--border); background: var(--surface); color: var(--text-muted); }
  .segment-broken { border-color: rgba(220, 38, 38, .38); background: rgba(220, 38, 38, .08); color: var(--red); }
  .info-note { background: rgba(8, 145, 178, .055); border: 1px solid rgba(8, 145, 178, .16); color: #0e7490; }
  html[data-theme="dark"] .info-note { color: #a5f3fc; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); }
  .text-amber-strong { color: var(--yellow); }
  table thead tr { border-color: var(--border) !important; }
  table tbody tr { border-color: var(--border-soft) !important; }

  /* 滚动条美化 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--page); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Tailwind 工具类在亮色主题下的语义映射。 */
  html[data-theme="light"] .text-gray-300 { color: #334b57 !important; }
  html[data-theme="light"] .text-gray-400 { color: #566f7a !important; }
  html[data-theme="light"] .text-gray-500 { color: #70858f !important; }
  html[data-theme="light"] .text-gray-600 { color: #91a1a9 !important; }
  html[data-theme="light"] .text-cyan-200 { color: #087f8c !important; }
  html[data-theme="light"] .text-cyan-300 { color: #0e7490 !important; }
  html[data-theme="light"] .text-green-400 { color: #047857 !important; }
  html[data-theme="light"] .text-yellow-400 { color: #b45309 !important; }
  html[data-theme="light"] .text-red-400 { color: #dc2626 !important; }
  html[data-theme="light"] .text-orange-300,
  html[data-theme="light"] .text-orange-400 { color: #c2410c !important; }
  html[data-theme="light"] .border-gray-800 { border-color: var(--border) !important; }

  @media (max-width: 900px) {
    .site-header { padding: 13px 16px; }
    .main-grid { grid-template-columns: minmax(0, 1fr); }
    .app-shell { padding-left: 14px !important; padding-right: 14px !important; }
  }
  @media (max-width: 560px) {
    .brand-mark { width: 38px; height: 38px; border-radius: 11px; }
    .segment-count { display: none; }
    .theme-toggle-label { display: none; }
    .theme-toggle { width: 36px; padding: 0; justify-content: center; }
    .app-shell { padding-top: 16px !important; }
    .card { border-radius: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<!-- ═══════════════ 顶部 Header ═══════════════ -->
<header class="site-header">
  <div class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M5 19c4.8-1 8.8-5 9.8-9.8"/>
      <path d="M8.1 15.9 4.6 12.4a2 2 0 0 1 0-2.8l5-5a2 2 0 0 1 2.8 0l3.5 3.5"/>
      <path d="m14 4 6 6M13 11l4-4"/>
      <circle cx="5" cy="19" r="1.5" fill="currentColor" stroke="none"/>
    </svg>
  </div>
  <div>
    <div class="brand-title font-bold text-lg tracking-wide">海缆故障传报系统</div>
    <div class="brand-subtitle text-xs mt-0.5">上海国际局 · 业务影响辅助研判</div>
  </div>
  <div class="header-actions">
    <div class="segment-count">
      <span class="segment-count-dot"></span>
      8 条海缆段落
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="切换至夜间模式" title="切换至夜间模式">
      <span class="theme-light-content">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <span class="theme-toggle-label">日间</span>
      </span>
      <span class="theme-dark-content">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"/>
        </svg>
        <span class="theme-toggle-label">夜间</span>
      </span>
    </button>
  </div>
</header>

<!-- ═══════════════ 主体 ═══════════════ -->
<div class="app-shell max-w-screen-xl mx-auto px-6 py-6" x-data="app()" x-init="init()">

  <!-- ── 数据源（槽路表）状态条 ── -->
  <div class="card p-4 mb-6">
    <div class="flex items-center gap-4 flex-wrap">
      <div class="text-xs font-semibold text-gray-400 uppercase tracking-wide flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-cyan-500 inline-block"></span>当前数据源
      </div>
      <template x-if="dataSource">
        <div class="flex items-center gap-3 flex-wrap text-sm">
          <span class="text-cyan-200 font-medium" x-text="dataSource.filename"></span>
          <span class="badge" :class="dataSource.readable ? 'badge-normal' : 'badge-broken'"
                x-text="dataSource.readable ? '读取正常' : '读取失败'"></span>
          <span class="text-xs text-gray-500" x-show="dataSource.circuit_count !== null"
                x-text="'可分析电路 ' + dataSource.circuit_count + ' 条'"></span>
          <span class="text-xs text-gray-500"
                x-text="dataSource.is_uploaded
                  ? ('上传于 ' + (dataSource.uploaded_at || '').replace('T',' '))
                  : '（项目自带默认样例，未上传）'"></span>
          <span class="text-xs text-red-400" x-show="dataSource.error" x-text="dataSource.error"></span>
        </div>
      </template>
      <div class="ml-auto flex items-center gap-2">
        <input type="file" x-ref="upload" accept=".xlsx,.xlsm" class="hidden" @change="uploadFile($event)">
        <button class="btn-ghost" :disabled="uploading" @click="$refs.upload.click()">
          <span x-show="!uploading">📤 上传槽路表</span>
          <span x-show="uploading">上传中…</span>
        </button>
      </div>
    </div>
    <div x-show="uploadMsg" x-cloak class="mt-2 text-xs"
         :class="uploadOk ? 'text-green-400' : 'text-red-400'" x-text="uploadMsg"></div>
  </div>

  <div class="main-grid">

    <!-- ── 左侧：态势图 + 录入表单 ── -->
    <div class="flex flex-col gap-5">

      <!-- 态势图 -->
      <div class="card p-4">
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-blue-500 inline-block"></span>实时故障态势
        </div>
        <!-- SVG 示意图 -->
        <div class="relative" style="user-select:none">
          <svg id="cable-svg" viewBox="0 0 380 300" class="cable-map w-full">

            <!-- 海岸线示意 -->
            <path d="M 80 0 Q 100 80 90 150 Q 85 220 100 300" stroke="var(--map-coast)" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
            <text x="50" y="16" font-size="9" fill="var(--text-muted)" font-family="PingFang SC,Microsoft YaHei,sans-serif">中国大陆</text>
            <text x="120" y="16" font-size="9" fill="var(--map-ocean)" font-family="PingFang SC,Microsoft YaHei,sans-serif">海洋</text>

            <!-- 崇明登陆站 -->
            <circle cx="88" cy="100" r="7" class="landing-dot"/>
            <circle cx="88" cy="100" r="11" fill="none" stroke="var(--blue)" stroke-width="1" opacity="0.4"/>
            <text x="18" y="97" font-size="10" fill="var(--landing-label)" font-weight="bold" font-family="PingFang SC,Microsoft YaHei,sans-serif">崇明</text>
            <text x="18" y="109" font-size="9" fill="var(--text-muted)" font-family="PingFang SC,Microsoft YaHei,sans-serif">登陆站</text>

            <!-- 南汇登陆站 -->
            <circle cx="88" cy="210" r="7" class="landing-dot"/>
            <circle cx="88" cy="210" r="11" fill="none" stroke="var(--blue)" stroke-width="1" opacity="0.4"/>
            <text x="18" y="207" font-size="10" fill="var(--landing-label)" font-weight="bold" font-family="PingFang SC,Microsoft YaHei,sans-serif">南汇</text>
            <text x="18" y="219" font-size="9" fill="var(--text-muted)" font-family="PingFang SC,Microsoft YaHei,sans-serif">登陆站</text>

            <!-- 崇明出口海缆（6条）-->
            <!-- TPE S1S  → 日本/美国方向（右上） -->
            <path id="seg-TPE_S1S"   d="M 95 96  Q 200 60  340 40"  class="cable-line normal"
                  @mouseenter="showTip($event,'TPE_S1S')"   @mouseleave="hideTip()"
                  @click="selectCable('TPE_S1S')"/>
            <text x="345" y="38"  font-size="9" fill="var(--text-muted)" font-family="sans-serif">日/美</text>

            <!-- TPE S4   → 台湾方向（右偏上） -->
            <path id="seg-TPE_S4"    d="M 95 100 Q 200 85  340 80"  class="cable-line normal"
                  @mouseenter="showTip($event,'TPE_S4')"    @mouseleave="hideTip()"
                  @click="selectCable('TPE_S4')"/>
            <text x="345" y="78"  font-size="9" fill="var(--text-muted)" font-family="sans-serif">台/日</text>

            <!-- APCN2 S3 → 香港/美国（右中偏上） -->
            <path id="seg-APCN2_S3"  d="M 95 103 Q 200 108 340 115" class="cable-line normal"
                  @mouseenter="showTip($event,'APCN2_S3')"  @mouseleave="hideTip()"
                  @click="selectCable('APCN2_S3')"/>
            <text x="345" y="113" font-size="9" fill="var(--text-muted)" font-family="sans-serif">港/美</text>

            <!-- APCN2 S4A→ 韩国/日本（右中） -->
            <path id="seg-APCN2_S4A" d="M 95 107 Q 200 130 340 148" class="cable-line normal"
                  @mouseenter="showTip($event,'APCN2_S4A')" @mouseleave="hideTip()"
                  @click="selectCable('APCN2_S4A')"/>
            <text x="345" y="147" font-size="9" fill="var(--text-muted)" font-family="sans-serif">韩/日</text>

                <th class="text-left text-gray-500 py-2 pr-2 font-medium">影响类型</th>

              <div class="metric-card p-2 rounded text-center">

                </tr></thead>
                <tbody>
                  <template x-for="(c,i) in comparison.manual_only" :key="'mo'+i">
                    <tr style="border-bottom:1px solid #1e2132; vertical-align:top">
                      <td class="py-2 pr-2" style="min-width:150px">
                        <div class="text-cyan-200" x-text="c.circuit_id || '（电路名提取失败）'"></div>
                        <div class="text-gray-600" x-text="(c.customer||'') + ' ' + (c.bandwidth||'')"></div>
                      </td>
                      <td class="py-2 pr-2" style="min-width:130px">
                        <template x-if="c.found_in_source">
                          <div>
                            <span class="badge" :class="c.source_status==='开通' ? 'badge-normal' : 'badge-broken'"
                                  x-text="c.source_status || '状态空'"></span>
                            <span class="badge badge-iepl ml-1" x-text="c.source_type || '?'"></span>
                            <div class="text-gray-500 mt-1" x-text="'路由：' + ((c.source_routes||[]).join(' / ') || '无')"></div>
                          </div>
                        </template>
                        <template x-if="!c.found_in_source">
                          <span class="badge badge-suspect">槽路表未找到</span>
                        </template>
                      </td>
                      <td class="py-2">
                        <div class="text-amber-strong font-semibold" x-text="c.cause"></div>
                        <div class="text-gray-500 mt-0.5 leading-relaxed" x-text="c.detail"></div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- 一致 -->
            <div x-show="compareTab==='matched'" class="overflow-x-auto">
              <div x-show="comparison.matched.length===0" class="text-center text-gray-600 py-4 text-sm">无</div>
              <table class="w-full text-xs" style="border-collapse:collapse" x-show="comparison.matched.length>0">
                <thead><tr style="border-bottom:1px solid #2e3347">
                  <th class="text-left text-gray-500 py-2 pr-2 font-medium">国际电路名</th>
                  <th class="text-left text-gray-500 py-2 pr-2 font-medium">客户</th>
                  <th class="text-left text-gray-500 py-2 pr-2 font-medium">带宽</th>
                  <th class="text-left text-gray-500 py-2 pr-2 font-medium">系统状态</th>
                  <th class="text-left text-gray-500 py-2 font-medium">人工状态</th>
                </tr></thead>
                <tbody>
                  <template x-for="(c,i) in comparison.matched" :key="'ma'+i">
                    <tr style="border-bottom:1px solid #1e2132">
                      <td class="py-2 pr-2 text-cyan-200" x-text="c.circuit_id || '—'"></td>
                      <td class="py-2 pr-2 text-gray-300" x-text="c.customer || '—'"></td>
                      <td class="py-2 pr-2 text-yellow-400" x-text="c.bandwidth"></td>
                      <td class="py-2 pr-2"><span class="badge" :class="impactBadgeClass(c.system_status)" x-text="c.system_status"></span></td>
                      <td class="py-2 text-gray-400" x-text="c.manual_status"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </div>

    </div>
  </div><!-- end grid -->
</div><!-- end main -->


<script>
function app() {
  return {
    // 状态
    cables: [],
    events: [],
    result: null,
    loading: false,
    copied: false,
    reportTab: 'first_email',
    circuitTab: 'iepl',
    tooltip: { visible: false, x: 0, y: 0, name: '', route: '', direction: '', status: 'normal', fault_time: '' },
    form: { cable_id: '', fault_time: '' },
    // 数据源
    dataSource: null,
    uploading: false,
    uploadMsg: '',
    uploadOk: false,
    // 对比
    comparison: null,
    compareLoading: false,
    compareTab: 'system_only',

    // ── 初始化 ──────────────────────────────────────────────────────
    async init() {
      await this.loadState();
      await this.loadDataSource();
      // 默认时间：本地当前时间（避免 toISOString() 带来的时区偏移）
      this.form.fault_time = this.nowLocalInputValue();
    },

    // ── 数据源 ──────────────────────────────────────────────────────
    async loadDataSource() {
      try {
        const res = await fetch('/api/datasource');
        this.dataSource = await res.json();
      } catch (e) { /* ignore */ }
    },

    async uploadFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      this.uploading = true;
      this.uploadMsg = '';
      try {
        const fd = new FormData();
        fd.append('file', file);
        const res = await fetch('/api/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.error) {
          this.uploadOk = false;
          this.uploadMsg = '上传失败：' + data.error;
        } else {
          this.uploadOk = true;
          this.dataSource = data.datasource;
          this.uploadMsg = '上传成功，分析已切换到新槽路表：' + data.datasource.filename;
          // 新数据源生效，清空旧结果与对比
          this.result = null;
          this.comparison = null;
        }
      } catch (e) {
        this.uploadOk = false;
        this.uploadMsg = '上传出错：' + e;
      } finally {
        this.uploading = false;
        event.target.value = '';
      }
    },

    // ── 系统 vs 人工 对比 ──────────────────────────────────────────
    async loadComparison() {
      if (!this.result) return;
      this.compareLoading = true;
      this.comparison = null;
      try {
        const res = await fetch('/api/compare?cable_id=' + encodeURIComponent(this.result.cable_id));
        this.comparison = await res.json();
        this.compareTab = 'system_only';
      } catch (e) {
        this.comparison = { error: '对比失败：' + e };
      } finally {
        this.compareLoading = false;
      }
    },

    async loadState() {
      const res  = await fetch('/api/state');
      const data = await res.json();
      this.events = data.events || [];
      // 加载海缆列表
      const res2  = await fetch('/api/cables');
      this.cables = await res2.json();
      this.syncSvg();
    },

    // ── 故障录入 ────────────────────────────────────────────────────
    async submitFault() {
      if (!this.form.cable_id || !this.form.fault_time) return;
      this.loading = true;
      try {
        const res = await fetch('/api/fault', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cable_id: this.form.cable_id, fault_time: this.form.fault_time }),
        });
        const data = await res.json();
        if (data.error) { alert(data.error); return; }
        this.result = data;
        this.comparison = null;
        this.events  = data.events || [];
        this.cables  = data.cables.map(s => {
          const info = this.cables.find(c => c.id === s.id) || {};
          return { ...info, ...s };
        });
        // 重新拉一次完整 cables 信息（含 label 等）
        const cablesRes = await fetch('/api/cables');
        this.cables = await cablesRes.json();
        this.syncSvg();
      } finally {
        this.loading = false;
      }
    },

    // ── 解除故障 ────────────────────────────────────────────────────
    async removeFault(eventId) {
      const res  = await fetch(`/api/fault/${eventId}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      this.events = data.events || [];
      // 更新 cables 状态
      const cablesRes = await fetch('/api/cables');
      this.cables = await cablesRes.json();
      this.syncSvg();
      // 如果当前结果的海缆已被解除，清空结果
      if (this.result) {
        const stillExists = this.events.find(e =>
          e.cable_id === this.result.cable_id && e.fault_time === this.result.fault_time
        );
        if (!stillExists) this.result = null;
      }
    },

    // ── 加载指定故障的通报 ──────────────────────────────────────────────
    async loadFaultReport(eventId) {
      this.loading = true;
      try {
        const url = `/api/analysis?event_id=${encodeURIComponent(eventId)}`;
        console.log('Loading fault report:', url);
        const res = await fetch(url);
        const data = await res.json();
        console.log('Received data:', {
          cable_id: data.cable_id,
          broken_ids: data.broken_ids,
          iepl_count: data.iepl?.length,
          ip_count: data.ip?.length
        });
        if (data.error) { alert(data.error); return; }
        data.event_id = eventId;  // 添加 event_id 用于高亮
        this.result = data;
        this.comparison = null;
      } finally {
        this.loading = false;
      }
    },

    // ── SVG 态势图同步 ──────────────────────────────────────────────
    syncSvg() {
      this.cables.forEach(c => {
        const el = document.getElementById('seg-' + c.id);
        if (!el) return;
        el.classList.remove('normal', 'broken');
        el.classList.add(c.status === 'broken' ? 'broken' : 'normal');
      });
    },

    selectCable(id) {
      this.form.cable_id = id;
    },

    // ── Tooltip ─────────────────────────────────────────────────────
    showTip(event, cableId) {
      const cable = this.cables.find(c => c.id === cableId);
      if (!cable) return;
      const svgRect = document.getElementById('cable-svg').getBoundingClientRect();
      const containerRect = event.target.closest('.relative').getBoundingClientRect();
      const x = event.clientX - containerRect.left + 10;
      const y = event.clientY - containerRect.top  + 10;
      const ev = this.events.find(e => e.cable_id === cableId);
      this.tooltip = {
        visible: true, x, y,
        name: `${cable.cable} 海缆 ${cable.segment} 段`,
        route: `路由：${cable.route_desc || ''}`,
        direction: `方向：${cable.direction || ''}方向`,
        status: cable.status,
        fault_time: ev ? this.formatTime(ev.fault_time) : '',
      };
    },

    hideTip() { this.tooltip.visible = false; },

    // ── 复制 ────────────────────────────────────────────────────────
    async copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        this.copied = true;
        setTimeout(() => this.copied = false, 2000);
      } catch {
        // 降级方案
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        this.copied = true;
        setTimeout(() => this.copied = false, 2000);
      }
    },

    // ── 下载 Excel ──────────────────────────────────────────────────
    async downloadExcel() {
      if (!this.result) return;
      const query = this.result.event_id
        ? `event_id=${encodeURIComponent(this.result.event_id)}`
        : `cable_id=${encodeURIComponent(this.result.cable_id)}&fault_time=${encodeURIComponent(this.result.fault_time)}`;
      const url = `/api/download?${query}`;
      try {
        const res = await fetch(url);
        if (!res.ok) {
          const error = await res.json().catch(() => ({}));
          throw new Error(error.error || `下载失败（${res.status}）`);
        }

        const disposition = res.headers.get('Content-Disposition') || '';
        const filenameMatch = disposition.match(/filename\*=UTF-8''([^;]+)/i);
        const filename = filenameMatch
          ? decodeURIComponent(filenameMatch[1])
          : '国际海缆故障影响业务统计表.xlsx';

        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objectUrl;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
      } catch (e) {
        alert(e.message || `下载失败：${e}`);
      }
    },

    nowLocalInputValue() {
      const d = new Date();
      d.setSeconds(0, 0);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${y}-${m}-${day}T${hh}:${mm}`;
    },

    // ── 工具函数 ─────────────────────────────────────────────────────
    cableLabel(id) {
      const c = this.cables.find(x => x.id === id);
      return c ? `${c.cable} ${c.segment}` : id;
    },

    formatTime(t) {
      if (!t) return '';
      const d = new Date(t.replace('T', ' '));
      if (isNaN(d)) return t;
      return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    },

    formatGbps(v) {
      if (v === undefined || v === null) return '--';
      if (v === 0) return '0G';
      if (v === Math.floor(v)) return v + 'G';
      // 去掉末尾无意义零
      return parseFloat(v.toFixed(4)) + 'G';
    },

    currentCircuits() {
      if (!this.result) return [];
      return this.circuitTab === 'iepl' ? this.result.iepl : this.result.ip;
    },

    impactBadgeClass(status) {
      const map = {
        '无保护':   'badge-broken',
        '主备双断':  'badge-broken',
        '主用':     'badge-primary',
        '备用':     'badge-backup',
        '疑似':     'badge-suspect',
      };
      return map[status] || 'badge-normal';
    },
  };
}
</script>
</body>
</html>
