<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海缆故障传报系统</title>
<script>
  // 在页面绘制前恢复主题，避免刷新时先闪出另一套配色。
  (() => {
    let theme = 'light';
    try {
      theme = new URLSearchParams(location.search).get('theme')
        || localStorage.getItem('subsentry-theme') || 'light';
    } catch (_) {}
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
  })();

  function applyTheme(theme, persist = true) {
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
    if (persist) {
      try { localStorage.setItem('subsentry-theme', theme); } catch (_) {}
    }
    const button = document.getElementById('theme-toggle');
    if (button) {
      const nextName = theme === 'light' ? '夜间模式' : '日间模式';
      button.setAttribute('aria-label', `切换至${nextName}`);
      button.setAttribute('title', `切换至${nextName}`);
    }
  }

  function toggleTheme() {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  }

  document.addEventListener('DOMContentLoaded', () => {
    applyTheme(document.documentElement.dataset.theme || 'light', false);
  });
</script>
<script src="/assets/vendor/tailwindcss.js"></script>
<script defer src="/assets/vendor/alpine.min.js"></script>
<style>
  /* Alpine.js x-cloak: 在 JS 初始化前隐藏元素，防止闪烁 */
  [x-cloak] { display: none !important; }

  :root {
    --accent: #175d74;
    --accent-strong: #124b5e;
    --ring: rgba(23, 93, 116, .14);
    --green: #0e8464;
    --red: #cf4040;
    --yellow: #a16207;
    --blue: #2673a3;
    --page: #f3f5f7;
    --card: #ffffff;
    --surface: #f7f8fa;
    --surface-strong: #eceff2;
    --border: #dde3e8;
    --border-soft: #e8ecf0;
    --text: #0e1922;
    --text-secondary: #2b3f4d;
    --text-muted: #48606d;
    --text-dim: #5f747f;
    --text-faint: #8d9aa5;
    --accent-id: #0f6f80;
    --info: #0e7490;
    --orange: #c2410c;
    --header: #ffffff;
    --header-border: #e2e7ec;
    --map-bg: #dce8ee;
    --map-land: #eef1f3;

    --map-ocean: #9db4c0;
    --landing-label: #175d74;
    --row-critical: rgba(207, 64, 64, .05);
    --shadow: 0 1px 2px rgba(23, 42, 58, .05);
    --shadow-pop: 0 6px 24px rgba(23, 42, 58, .14);
  }

  html[data-theme="dark"] {
    --accent: #2e8aa8;
    --accent-strong: #38a0c0;
    --ring: rgba(79, 179, 210, .22);
    --green: #2fbf8f;
    --red: #e85c5c;
    --yellow: #ddab4a;
    --blue: #5aa3d8;
    --page: #0e1417;
    --card: #161d22;
    --surface: #121a1e;
    --surface-strong: #1d262c;
    --border: #2a353c;
    --border-soft: #202a30;
    --text: #eaf1f5;
    --text-secondary: #c6d2d9;
    --text-muted: #a0afb9;
    --text-dim: #8898a2;
    --text-faint: #64727b;
    --accent-id: #7fd4e8;
    --info: #6cc9de;
    --orange: #e8a06a;
    --header: #12181d;
    --header-border: #232e35;
    --map-bg: #0d161b;
    --map-land: #1e282f;
    --map-coast: #41525c;
    --map-ocean: #46585f;
    --landing-label: #8fd0e4;
    --row-critical: rgba(232, 92, 92, .055);

    --shadow-pop: 0 8px 28px rgba(0, 0, 0, .45);
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    min-height: 100vh;
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .2s ease;
  }

  .site-header {
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 32px;
    background: var(--header);
    border-bottom: 1px solid var(--header-border);
  }
  .brand-mark {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    color: #fff;
    background: var(--accent);
  }
  .brand-mark svg { width: 21px; height: 21px; }
  .brand-title { color: var(--text); }
  .brand-subtitle { color: var(--text-dim); }
  .header-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .segment-count {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-muted);
    background: var(--surface);
    font-size: 12px;
    font-weight: 500;
  }
  .segment-count-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .theme-toggle {
    height: 32px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle svg { width: 15px; height: 15px; }
  .theme-light-content { display: inline-flex; align-items: center; gap: 7px; }
  .theme-dark-content { display: none; }
  html[data-theme="dark"] .theme-light-content { display: none; }
  html[data-theme="dark"] .theme-dark-content { display: inline-flex; align-items: center; gap: 7px; }

  .app-shell { position: relative; z-index: 1; }
  .main-grid { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    transition: background .2s ease, border-color .2s ease;
  }
  .surface-muted { background: var(--surface); border: 1px solid var(--border-soft); }
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: .02em;
  }
  .section-meta { font-size: 12px; font-weight: 400; color: var(--text-dim); }
  .input {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    transition: border .15s, box-shadow .15s;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .input-uniform { height: 38px; }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 8px 18px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-danger  { background: transparent; color: var(--red); border: 1px solid transparent; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; transition: background .15s, border-color .15s; }
  .btn-danger:hover { background: rgba(207, 64, 64, .08); border-color: rgba(207, 64, 64, .3); }
  .btn-ghost   { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 7px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: border-color .15s, color .15s, background .15s; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .tab-btn {
    padding: 7px 2px;
    margin: 0 10px -1px 0;
    font-size: 13px;
    cursor: pointer;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    background: transparent;
    transition: color .15s, border-color .15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  html[data-theme="dark"] .tab-btn.active { color: var(--accent-strong); border-bottom-color: var(--accent-strong); }
  .copy-area { font-size: 13.5px; line-height: 1.85; white-space: pre-wrap; background: var(--surface); border: 1px solid var(--border-soft); border-radius: 8px; padding: 14px 16px; color: var(--text); }
  .impact-row-critical { background: var(--row-critical); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge-broken  { background: rgba(207, 64, 64, .1);  color: var(--red); }
  .badge-primary { background: rgba(161, 98, 7, .1);   color: var(--yellow); }
  .badge-backup  { background: rgba(38, 115, 163, .1); color: var(--blue); }
  .badge-suspect { background: rgba(126, 58, 194, .09); color: #7e3ac2; }
  .badge-normal  { background: rgba(14, 132, 100, .1); color: var(--green); }
  .badge-ip      { background: rgba(14, 132, 100, .1); color: var(--green); }
  .badge-iepl    { background: rgba(161, 98, 7, .1);   color: var(--yellow); }
  .badge-shanghai { background: rgba(15, 111, 128, .1); color: var(--accent-id); }
  html[data-theme="dark"] .badge-broken  { background: rgba(232, 92, 92, .12); }
  html[data-theme="dark"] .badge-primary { background: rgba(221, 171, 74, .1); }
  html[data-theme="dark"] .badge-backup  { background: rgba(90, 163, 216, .12); }
  html[data-theme="dark"] .badge-suspect { background: rgba(167, 139, 250, .12); color: #b5a3f5; }
  html[data-theme="dark"] .badge-normal,
  html[data-theme="dark"] .badge-ip      { background: rgba(47, 191, 143, .1); }
  html[data-theme="dark"] .badge-iepl    { background: rgba(221, 171, 74, .1); }
  html[data-theme="dark"] .badge-shanghai { background: rgba(127, 212, 232, .1); }

  /* SVG 海缆线条动画 */
  .cable-line { stroke-width: 2; fill: none; stroke-linecap: round; transition: stroke .4s, stroke-width .3s; cursor: pointer; }
  .cable-line.normal { stroke: var(--green); opacity: .7; }
  .cable-line.broken { stroke: var(--red); stroke-width: 2.5; stroke-dasharray: 7 4; animation: dash 1s linear infinite; }
  .cable-line:hover  { stroke-width: 3.5; opacity: 1; }
  @keyframes dash { to { stroke-dashoffset: -24; } }
  .cable-map { background: var(--map-bg); border: 1px solid var(--border-soft); border-radius: 8px; }
  .cable-map text { font-family: inherit; }
  .map-land { fill: var(--map-land); stroke: var(--map-coast); stroke-width: .6; stroke-linejoin: round; }
  .map-grat line { stroke: var(--map-coast); stroke-width: .35; stroke-dasharray: 2 3; opacity: .4; }
  .map-label { fill: var(--text-muted); font-size: 9.5px; font-weight: 600; }
  .map-sea { fill: var(--map-ocean); font-size: 8.5px; letter-spacing: 2px; }
  .map-dir { fill: var(--text-dim); font-size: 8.5px; }
  .map-station { fill: var(--landing-label); font-size: 9.5px; font-weight: 600; }
  .map-legend { fill: var(--text-muted); font-size: 8.5px; }
  .peer-dot { fill: var(--map-bg); stroke: var(--text-dim); stroke-width: 1; }
  .cable-ext { fill: none; stroke: var(--text-faint); stroke-width: 1; stroke-dasharray: 3 4; opacity: .7; }
  .landing-dot { fill: var(--accent); }
  .tooltip-box { position: absolute; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--text); pointer-events: none; z-index: 50; min-width: 160px; box-shadow: var(--shadow-pop); }
  .timeline-event, .timeline-event-active { border: 1px solid var(--border-soft); }
  .timeline-event { background: var(--surface); }
  .timeline-event:hover { border-color: var(--border); }
  .timeline-event-active { background: var(--surface-strong); border-color: var(--accent); box-shadow: inset 2px 0 0 var(--accent); }
  .segment-pill { transition: border-color .2s, background .2s, color .2s; }
  .segment-normal { border-color: var(--border); background: transparent; color: var(--text-dim); }
  .segment-normal:hover { border-color: var(--accent); color: var(--accent); }
  .segment-broken { border-color: rgba(207, 64, 64, .4); background: rgba(207, 64, 64, .07); color: var(--red); }
  .info-note { background: var(--surface); border: 1px solid var(--border-soft); color: var(--text-muted); }
  .metric-card { background: var(--surface); border: 1px solid var(--border-soft); }
  .metric-num { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; color: var(--red); }
  .text-amber-strong { color: var(--yellow); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Mono", monospace; font-size: .96em; }

  /* 语义文本色（取代 Tailwind 灰阶工具类，明暗主题各自取值） */
  .t-secondary { color: var(--text-secondary); }
  .t-muted     { color: var(--text-muted); }
  .t-dim       { color: var(--text-dim); }
  .t-faint     { color: var(--text-faint); }
  .t-id        { color: var(--accent-id); }
  .t-info      { color: var(--info); }
  .t-ok        { color: var(--green); }
  .t-warn      { color: var(--yellow); }
  .t-crit      { color: var(--red); }
  .t-alert     { color: var(--orange); }

  .data-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .data-table thead tr { border-bottom: 1px solid var(--border); }
  .data-table th { white-space: nowrap; font-weight: 600; }
  .data-table tbody tr { border-bottom: 1px solid var(--border-soft); transition: background .12s; }
  .data-table tbody tr:hover { background: var(--surface); }
  .data-table .t-id { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Mono", monospace; font-size: 11.5px; }
  .tab-bar { border-bottom: 1px solid var(--border); }

  /* 故障全流程时间线 */
  .workflow-line { display: grid; grid-template-columns: repeat(var(--stage-count), minmax(112px, 1fr)); gap: 0; overflow-x: auto; padding: 8px 2px 2px; }
  .workflow-stage { position: relative; min-width: 112px; border: 0; background: transparent; color: var(--text-dim); cursor: pointer; text-align: center; padding: 0 8px 12px; }
  .workflow-stage::before { content: ""; position: absolute; left: 0; right: 0; top: 16px; height: 2px; background: var(--border); }
  .workflow-stage:first-child::before { left: 50%; }
  .workflow-stage:last-child::before { right: 50%; }
  .workflow-dot { position: relative; z-index: 1; width: 34px; height: 34px; margin: 0 auto 8px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; background: var(--card); color: var(--text-faint); font-size: 13px; font-weight: 700; transition: all .18s ease; }
  .workflow-stage.is-completed .workflow-dot { border-color: var(--green); background: var(--green); color: #fff; }
  .workflow-stage.is-progress .workflow-dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
  .workflow-stage.is-waiting .workflow-dot { border-style: dashed; }
  .workflow-stage.is-active { color: var(--text); font-weight: 700; }
  .workflow-stage.is-active .workflow-dot { border-color: var(--accent); }
  .workflow-label { display: block; font-size: 12px; white-space: nowrap; }
  .workflow-state { display: block; margin-top: 3px; font-size: 10px; font-weight: 400; color: var(--text-faint); }
  .workflow-panel { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 9px; }
  .task-item { border-bottom: 1px solid var(--border-soft); }
  .task-item:last-child { border-bottom: 0; }
  .task-row { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 0; }
  .task-check { width: 25px; height: 25px; flex: none; border-radius: 50%; border: 1.5px solid var(--border); background: var(--card); color: transparent; display: grid; place-items: center; cursor: pointer; font-size: 14px; font-weight: 800; transition: all .15s; }
  .task-check:hover { border-color: var(--accent); }
  .task-check.done { color: #fff; border-color: var(--green); background: var(--green); }
  .task-check:disabled { opacity: .45; cursor: not-allowed; }
  .task-channel { min-width: 0; flex: 1; display: flex; align-items: center; gap: 10px; border: 0; background: transparent; color: var(--text); padding: 4px 0; text-align: left; cursor: pointer; }
  .task-channel:disabled { cursor: default; }
  .task-chevron { width: 17px; height: 17px; margin-left: auto; flex: none; color: var(--text-faint); transition: transform .18s ease, color .18s ease; }
  .task-channel.is-open .task-chevron { transform: rotate(180deg); color: var(--accent); }
  .task-content { margin: 0 0 12px 35px; padding: 12px; border: 1px solid var(--border-soft); border-radius: 8px; background: var(--card); }
  .task-content .copy-area { min-height: 0; padding: 12px; font-size: 13px; line-height: 1.75; }
  .fixed-info-chip { padding: 5px 9px; border-radius: 6px; background: var(--card); border: 1px solid var(--border-soft); font-size: 11px; color: var(--text-muted); }
  textarea.input { min-height: 78px; height: auto; resize: vertical; }

  /* 按钮内图标 + 文字 */
  .btn-label { display: inline-flex; align-items: center; gap: 6px; }
  .btn-label svg { width: 14px; height: 14px; flex: none; }

  /* 滚动条美化 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--page); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 900px) {
    .site-header { padding: 13px 16px; }
    .main-grid { grid-template-columns: minmax(0, 1fr); }
    .app-shell { padding-left: 14px !important; padding-right: 14px !important; }
  }
  @media (max-width: 560px) {
    .brand-mark { width: 38px; height: 38px; border-radius: 11px; }
    .segment-count { display: none; }
    .theme-toggle-label { display: none; }
    .theme-toggle { width: 36px; padding: 0; justify-content: center; }
    .app-shell { padding-top: 16px !important; }
    .card { border-radius: 12px; }
    .workflow-line { grid-template-columns: repeat(var(--stage-count), 128px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<!-- ═══════════════ 顶部 Header ═══════════════ -->
<header class="site-header">
  <div class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M5 19c4.8-1 8.8-5 9.8-9.8"/>
      <path d="M8.1 15.9 4.6 12.4a2 2 0 0 1 0-2.8l5-5a2 2 0 0 1 2.8 0l3.5 3.5"/>

      <circle cx="5" cy="19" r="1.5" fill="currentColor" stroke="none"/>

  </div>

    <div class="brand-title font-bold text-lg tracking-wide">海缆故障传报系统</div>

<!-- ═══════════════ 主体 ═══════════════ -->
<div class="app-shell max-w-screen-xl mx-auto px-6 py-6" x-data="app()" x-init="init()">

  <!-- ── 数据源（槽路表）状态条 ── -->
  <div class="card p-4 mb-6">
    <div class="flex items-center gap-4 flex-wrap">
      <div class="section-title">当前数据源</div>
      <template x-if="dataSource">
        <div class="flex items-center gap-3 flex-wrap text-sm">
          <span class="t-id font-medium" x-text="dataSource.filename"></span>
          <span class="badge" :class="dataSource.readable ? 'badge-normal' : 'badge-broken'"

        <div class="mt-3 flex flex-wrap gap-2">
          <template x-for="c in cables" :key="c.id">
            <span class="segment-pill text-xs px-2 py-0.5 rounded cursor-pointer border"
                  :class="c.status==='broken'
                    ? 'segment-broken'
                    : 'segment-normal'"
                  @click="selectCable(c.id)"
                  x-text="`${c.cable} ${c.segment}`">
            </span>
          </template>
        </div>
      </div>

      <!-- 故障录入表单 -->
      <div class="card p-4">
        <div class="section-title mb-3">故障录入</div>
        <div class="flex flex-col gap-3">
          <div>
            <label class="text-xs t-dim mb-1 block">故障海缆段落 *</label>
            <select x-model="form.cable_id" class="input input-uniform w-full">
              <option value="">— 请选择 —</option>
              <template x-for="c in cables" :key="c.id">
                <option :value="c.id" x-text="`${c.cable} ${c.segment}`"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="text-xs t-dim mb-1 block">中断时间 *</label>
            <input x-model="form.fault_time" type="datetime-local" class="input input-uniform w-full">
          </div>
          <button class="btn-primary w-full" :disabled="loading || !form.cable_id || !form.fault_time"
                  @click="submitFault()">
            <span x-show="!loading" class="btn-label justify-center">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
              生成通报
            </span>
            <span x-show="loading">分析中…</span>
          </button>
        </div>
      </div>

      <!-- 故障记录 -->
      <div class="card p-4" x-show="events.length > 0">
        <div class="section-title mb-3">
          故障记录 (<span x-text="events.length"></span>)
          <span class="ml-auto section-meta">点击查看通报</span>
        </div>
        <div class="flex flex-col gap-2">
          <template x-for="ev in events" :key="ev.id">
            <div class="flex items-center justify-between gap-2 p-2 rounded cursor-pointer transition-all"
                 :class="result && result.event_id === ev.id ? 'timeline-event-active' : 'timeline-event'"
                 @click="loadFaultReport(ev.id)">
              <div>
                <span class="t-crit font-semibold text-sm"
                      x-text="cableLabel(ev.cable_id)"></span>
                <span class="t-dim text-xs ml-2" x-text="formatTime(ev.fault_time)"></span>
                <span class="badge ml-1" :class="eventIsResolved(ev) ? 'badge-normal' : 'badge-broken'"
                      x-text="eventIsResolved(ev) ? '已终报' : '处理中'"></span>
              </div>
              <button class="btn-danger" @click.stop="removeFault(ev.id)">删除</button>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- ── 右侧：通报输出 + 业务影响 ── -->
    <div class="flex flex-col gap-5">

      <!-- 空态提示 -->
      <div x-show="!result" class="card p-12 text-center">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="width:44px;height:44px;margin:0 auto 12px;display:block">
          <path d="M4 10a7.31 7.31 0 0 0 10 10Z"/><path d="m9 15 3-3"/><path d="M17 13a6 6 0 0 0-6-6"/><path d="M21 13A10 10 0 0 0 11 3"/>
        </svg>
        <div class="t-dim">在左侧选择故障海缆和时间，点击「生成通报」</div>
      </div>

      <!-- 故障处理进度 -->
      <div class="card p-4" x-show="result && result.workflow" x-cloak>
        <div class="flex items-center gap-4 mb-3">
          <div>
            <div class="section-title">故障处理进度</div>
          </div>
        </div>

        <div class="workflow-line"
             :style="`--stage-count:${applicableWorkflowStages().length || 1}`">
          <template x-for="(stage, index) in applicableWorkflowStages()" :key="stage.id">
            <button class="workflow-stage"
                    :class="workflowStageClass(stage)"
                    @click="selectWorkflowStage(stage.id)">
              <span class="workflow-dot" x-text="stage.status === 'completed' ? '✓' : index + 1"></span>
              <span class="workflow-label" x-text="stage.label"></span>
              <span class="workflow-state" x-text="workflowStatusLabel(stage.status)"></span>
            </button>
          </template>
        </div>

        <template x-if="currentWorkflowStage()">
          <div class="workflow-panel p-4 mt-3">
            <div class="flex items-start gap-3 flex-wrap">
              <div>
                <div class="font-bold text-sm" x-text="currentWorkflowStage().label"></div>
                <div class="text-xs t-dim mt-1" x-text="workflowStageHint(currentWorkflowStage())"></div>
              </div>
              <span class="badge ml-auto"
                    :class="currentWorkflowStage().status === 'completed' ? 'badge-normal' : 'badge-backup'"
                    x-text="workflowStatusLabel(currentWorkflowStage().status)"></span>
            </div>

            <div class="flex flex-wrap gap-2 mt-3" x-show="result && result.cable">
              <span class="fixed-info-chip" x-text="'登陆站：' + result.cable.landing"></span>
              <span class="fixed-info-chip" x-text="'段落方向：' + result.cable.route_desc"></span>
              <span class="fixed-info-chip" x-text="'影响方向：' + result.cable.direction"></span>
            </div>

            <!-- 各阶段仅填写新出现的变量 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4"
                 x-show="selectedStage === 'first_report'">
              <div>
                <label class="text-xs t-dim mb-1 block">首报时用户申告数 *</label>
                <input class="input input-uniform w-full" type="number" min="0"
                       :disabled="currentWorkflowStage().status === 'completed' && currentWorkflowStage().ready"
                       x-model="stageForm.complaint_count" placeholder="请填写当前已收到的申告数">
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4"
                 x-show="selectedStage === 'breakpoint_report'">
              <div>
                <label class="text-xs t-dim mb-1 block">断点距离崇明登陆站（公里）*</label>
                <input class="input input-uniform w-full" type="number" min="0" step="0.1"
                       :disabled="currentWorkflowStage().status === 'completed' && currentWorkflowStage().ready"
                       x-model="stageForm.distance_km" placeholder="例如：126.4">
              </div>
              <div>
                <label class="text-xs t-dim mb-1 block">当前用户申告数 *</label>
                <input class="input input-uniform w-full" type="number" min="0"
                       :disabled="currentWorkflowStage().status === 'completed' && currentWorkflowStage().ready"
                       x-model="stageForm.complaint_count">
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-4"
                 x-show="selectedStage === 'repair_plan_report'">
              <div>
                <label class="text-xs t-dim mb-1 block">计划开始维修日期 *</label>
                <input class="input input-uniform w-full" type="date"
                       :disabled="currentWorkflowStage().status === 'completed' && currentWorkflowStage().ready" x-model="stageForm.repair_start_date">
              </div>
              <div>
                <label class="text-xs t-dim mb-1 block">预计修复日期 *</label>
                <input class="input input-uniform w-full" type="date"
                       :disabled="currentWorkflowStage().status === 'completed' && currentWorkflowStage().ready" x-model="stageForm.expected_restore_date">
              </div>
              <div>
                <label class="text-xs t-dim mb-1 block">当前用户申告数 *</label>
                <input class="input input-uniform w-full" type="number" min="0"
                       :disabled="currentWorkflowStage().status === 'completed' && currentWorkflowStage().ready" x-model="stageForm.complaint_count">
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4"
                 x-show="selectedStage === 'final_report'">
              <div>
                <label class="text-xs t-dim mb-1 block">实际修复时间 *</label>
                <input class="input input-uniform w-full" type="datetime-local"
                       :disabled="currentWorkflowStage().status === 'completed' && currentWorkflowStage().ready" x-model="stageForm.actual_restore_time">
              </div>
              <div>
                <label class="text-xs t-dim mb-1 block">最终用户申告数 *</label>
                <input class="input input-uniform w-full" type="number" min="0"
                       :disabled="currentWorkflowStage().status === 'completed' && currentWorkflowStage().ready" x-model="stageForm.complaint_count">
              </div>
              <div class="md:col-span-2">
                <label class="text-xs t-dim mb-1 block">最终故障原因 *</label>
                <textarea class="input w-full" x-model="stageForm.fault_cause"
                          :disabled="currentWorkflowStage().status === 'completed' && currentWorkflowStage().ready"
                          placeholder="例如：经TPE NOC确认，故障由渔业作业造成海缆外力损伤。"></textarea>
              </div>
            </div>

            <div class="mt-3"
                 x-show="['first_report','breakpoint_report','repair_plan_report','final_report'].includes(selectedStage)">
              <button class="btn-primary"
                      :disabled="workflowSaving || (currentWorkflowStage().status === 'completed' && currentWorkflowStage().ready)"
                      @click="saveStageFields()">
                <span x-text="workflowSaving ? '保存中…' : '保存本阶段信息'"></span>
              </button>
              <span class="text-xs t-ok ml-2" x-show="workflowSaved">信息已保存，通报内容已更新</span>
            </div>

            <div class="mt-4">
              <div class="text-xs font-semibold t-secondary mb-1">传报渠道确认</div>
              <template x-for="task in currentWorkflowStage().tasks" :key="task.id">
                <div class="task-item">
                  <div class="task-row">
                    <button class="task-check" :class="task.completed && 'done'"
                            :disabled="workflowSaving || (!currentWorkflowStage().can_complete && !task.completed)"
                            @click="toggleWorkflowTask(task)">
                      <span>✓</span>
                    </button>
                    <button class="task-channel"
                            :class="expandedTasks.includes(task.id) && 'is-open'"
                            :disabled="!taskHasReport(task)"
                            @click="toggleTaskContent(task)">
                      <span class="min-w-0">
                        <span class="text-sm font-medium block" x-text="task.label"></span>
                        <span class="text-xs t-faint block" x-show="task.completed"
                              x-text="'完成于 ' + formatDateTime(task.completed_at)"></span>
                        <span class="text-xs t-warn mt-0.5 block"
                              x-show="task.id === 'supervisor_excel' && (!currentWorkflowStage().ready || stageHasUnsavedChanges())">
                          请先保存本阶段信息，再下载文件
                        </span>
                      </span>
                      <svg class="task-chevron" x-show="taskHasReport(task)" viewBox="0 0 24 24" fill="none"
                           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                      </svg>
                    </button>
                    <button class="btn-ghost"
                            x-show="task.id === 'supervisor_excel'"
                            @click="downloadSupervisorExcel(selectedStage)">下载文件</button>
                    <button class="btn-ghost"
                            x-show="task.id === 'email_attachment'"
                            @click="downloadExcel()">下载附件</button>
                  </div>
                  <div class="task-content" x-show="expandedTasks.includes(task.id) && taskHasReport(task)">
                    <div class="copy-area" x-text="reportTextForTask(task.id)"></div>
                    <div class="mt-2">
                      <button class="btn-ghost" @click="copyText(reportTextForTask(task.id))">
                        <span x-text="copied ? '已复制' : '复制文案'"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- 业务影响统计 -->
      <div class="card p-4" x-show="result" x-cloak>
        <div class="section-title mb-3">业务影响统计</div>

        <!-- 汇总数字 -->
        <div class="grid grid-cols-2 gap-3 mb-4" x-show="result">
          <div class="surface-muted p-3 rounded-lg">
            <div class="text-xs t-dim mb-1">IP带宽损失（中断）</div>
            <div class="metric-num" x-text="result ? formatGbps(result.summary.ip_loss_gbps) : '--'"></div>
            <div class="text-xs t-faint mt-0.5" x-text="result ? '上海落地 ' + formatGbps(result.summary.ip_loss_sh_gbps) : ''"></div>
          </div>
          <div class="surface-muted p-3 rounded-lg">
            <div class="text-xs t-dim mb-1">IEPL专线中断（无保护/双断）</div>
            <div class="metric-num" x-text="result ? result.summary.iepl_broken + ' 条' : '--'"></div>
            <div class="text-xs t-faint mt-0.5" x-text="result ? '上海落地 ' + result.summary.iepl_broken_sh + ' 条' : ''"></div>
          </div>
        </div>

        <!-- IEPL / IP 电路详情 Tabs -->
        <div class="flex gap-1 tab-bar mb-3">
          <button class="tab-btn text-xs" :class="circuitTab==='iepl'&&'active'" @click="circuitTab='iepl'">
            客户专线 IEPL (<span x-text="result ? result.iepl.length : 0"></span>)
          </button>
          <button class="tab-btn text-xs" :class="circuitTab==='ip'&&'active'" @click="circuitTab='ip'">
            IP电路 (<span x-text="result ? result.ip.length : 0"></span>)
          </button>
        </div>

        <!-- 电路表格 -->
        <div x-show="result && currentCircuits().length === 0"
             class="text-center t-faint py-6 text-sm">暂无受影响电路</div>

        <div class="overflow-x-auto" x-show="result">
          <table class="data-table text-xs">
            <thead>
              <tr>
                <th class="text-left t-dim py-2 pr-2 font-medium">#</th>
                <th class="text-left t-dim py-2 pr-2 font-medium">影响类型</th>
                <th class="text-left t-dim py-2 pr-2 font-medium">客户名称</th>
                <th class="text-left t-dim py-2 pr-2 font-medium">国际电路名</th>
                <th class="text-left t-dim py-2 pr-2 font-medium">A端</th>
                <th class="text-left t-dim py-2 pr-2 font-medium">Z端</th>
                <th class="text-left t-dim py-2 pr-3 font-medium">带宽</th>
                <th class="text-left t-dim py-2 font-medium">第一路由</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(c, i) in currentCircuits()" :key="c.circuit_id + '_' + i">
                <tr :class="c.is_broken ? 'impact-row-critical' : ''">
                  <td class="py-2 pr-2 t-faint" x-text="i+1"></td>
                  <td class="py-2 pr-2 whitespace-nowrap">
                    <span :class="impactBadgeClass(c.impact_status)" class="badge"
                          x-text="c.impact_status"></span>
                    <span x-show="c.is_shanghai" class="badge badge-shanghai ml-1">沪</span>
                  </td>
                  <td class="py-2 pr-2 font-medium" x-text="c.customer || '—'"></td>
                  <td class="py-2 pr-2 t-id" x-text="c.circuit_id || '—'"></td>
                  <td class="py-2 pr-2 t-muted whitespace-nowrap" x-text="c.site_a"></td>
                  <td class="py-2 pr-2 t-muted whitespace-nowrap" x-text="c.site_b"></td>
                  <td class="py-2 pr-3 font-semibold t-warn whitespace-nowrap" x-text="c.bandwidth"></td>
                  <td class="py-2 t-dim" x-text="c.route1"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- 人工对比 -->
        <div class="mt-4 flex items-center gap-3">
          <button class="btn-ghost" @click="loadComparison()" :disabled="compareLoading" x-show="result">
            <span x-show="!compareLoading" class="btn-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
              系统结果 vs 人工结果
            </span>
            <span x-show="compareLoading">对比中…</span>
          </button>
        </div>
      </div>

      <!-- 系统 vs 人工 对比 -->
      <div class="card p-4" x-show="comparison" x-cloak>
        <div class="section-title mb-3">
          系统结果 vs 人工结果
          <span class="ml-auto section-meta"
                x-text="comparison && comparison.cable_label"></span>
        </div>

        <template x-if="comparison && comparison.error">
          <div class="text-center t-dim py-4 text-sm" x-text="comparison.error"></div>
        </template>

        <template x-if="comparison && comparison.manual_available">
          <div>
            <div class="text-xs t-dim mb-3">
              人工清单文件：<span class="t-muted" x-text="comparison.manual_file"></span>
            </div>
            <div class="info-note text-xs mb-3 px-3 py-2 rounded">
              <span x-text="comparison.scope_note"></span>
            </div>
            <!-- 汇总数量 -->
            <div class="grid gap-2 mb-4" style="grid-template-columns:repeat(auto-fit,minmax(105px,1fr))">
              <div class="metric-card p-2 rounded text-center">
                <div class="text-lg font-bold t-ok" x-text="comparison.summary.matched"></div>
                <div class="text-xs t-dim">一致</div>
              </div>
              <div class="metric-card p-2 rounded text-center">
                <div class="text-lg font-bold t-warn" x-text="comparison.summary.system_only"></div>
                <div class="text-xs t-dim">系统多出</div>
              </div>
              <div class="metric-card p-2 rounded text-center">
                <div class="text-lg font-bold t-crit" x-text="comparison.summary.manual_only"></div>
                <div class="text-xs t-dim">系统漏掉</div>
              </div>
              <div class="metric-card p-2 rounded text-center">
                <div class="text-lg font-bold t-alert" x-text="comparison.summary.status_mismatch"></div>
                <div class="text-xs t-dim">状态不一致</div>
              </div>
              <div class="metric-card p-2 rounded text-center">
                <div class="text-lg font-bold t-info" x-text="comparison.summary.unverified"></div>
                <div class="text-xs t-dim">IP 待核验</div>
              </div>
              <div class="metric-card p-2 rounded text-center">
                <div class="text-lg font-bold t-secondary">
                  <span x-text="comparison.summary.system_count"></span>/<span x-text="comparison.summary.manual_count"></span>
                </div>
                <div class="text-xs t-dim">系统/人工</div>
              </div>
            </div>

            <!-- 对比明细 Tabs -->
            <div class="flex flex-wrap gap-1 tab-bar mb-3">
              <button class="tab-btn text-xs" :class="compareTab==='system_only'&&'active'" @click="compareTab='system_only'">
                系统多出 (<span x-text="comparison.system_only.length"></span>)
              </button>
              <button class="tab-btn text-xs" :class="compareTab==='manual_only'&&'active'" @click="compareTab='manual_only'">
                系统漏掉 (<span x-text="comparison.manual_only.length"></span>)
              </button>
              <button class="tab-btn text-xs" :class="compareTab==='status_mismatch'&&'active'" @click="compareTab='status_mismatch'">
                状态不一致 (<span x-text="comparison.status_mismatch.length"></span>)
              </button>
              <button class="tab-btn text-xs" :class="compareTab==='unverified'&&'active'" @click="compareTab='unverified'">
                IP 待核验 (<span x-text="comparison.unverified.length"></span>)
              </button>
              <button class="tab-btn text-xs" :class="compareTab==='matched'&&'active'" @click="compareTab='matched'">
                一致 (<span x-text="comparison.matched.length"></span>)
              </button>
            </div>

            <!-- 系统多出 -->
            <div x-show="compareTab==='system_only'" class="overflow-x-auto">
              <div x-show="comparison.system_only.length===0" class="text-center t-faint py-4 text-sm">无</div>
              <table class="data-table text-xs" x-show="comparison.system_only.length>0">
                <thead><tr>
                  <th class="text-left t-dim py-2 pr-2 font-medium">国际电路名</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">客户</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">带宽</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">类型</th>
                  <th class="text-left t-dim py-2 font-medium">可能原因</th>
                </tr></thead>
                <tbody>
                  <template x-for="(c,i) in comparison.system_only" :key="'so'+i">
                    <tr>
                      <td class="py-2 pr-2 t-id" x-text="c.circuit_id || '—'"></td>
                      <td class="py-2 pr-2 t-secondary" x-text="c.customer || '—'"></td>
                      <td class="py-2 pr-2 font-medium t-warn whitespace-nowrap" x-text="c.bandwidth"></td>
                      <td class="py-2 pr-2 t-muted" x-text="c.type"></td>
                      <td class="py-2 t-dim" x-text="c.reason"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- 同一电路已命中，但影响状态不同 -->
            <div x-show="compareTab==='status_mismatch'" class="overflow-x-auto">
              <div x-show="comparison.status_mismatch.length===0" class="text-center t-faint py-4 text-sm">无</div>
              <table class="data-table text-xs" x-show="comparison.status_mismatch.length>0">
                <thead><tr>
                  <th class="text-left t-dim py-2 pr-2 font-medium">国际电路名</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">客户</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">人工状态</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">系统状态</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">人工路由</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">系统路由</th>
                  <th class="text-left t-dim py-2 font-medium">差异说明</th>
                </tr></thead>
                <tbody>
                  <template x-for="(c,i) in comparison.status_mismatch" :key="'sm'+i">
                    <tr style="vertical-align:top">
                      <td class="py-2 pr-2 t-id" x-text="c.circuit_id || '—'"></td>
                      <td class="py-2 pr-2 t-secondary" x-text="c.customer || '—'"></td>
                      <td class="py-2 pr-2 t-secondary"><span class="badge" x-text="c.manual_status"></span></td>
                      <td class="py-2 pr-2"><span class="badge" :class="impactBadgeClass(c.system_status)" x-text="c.system_status"></span></td>
                      <td class="py-2 pr-2 t-muted" x-text="c.manual_routes.join(' / ') || '—'"></td>
                      <td class="py-2 pr-2 t-muted" x-text="c.system_routes.join(' / ') || '—'"></td>
                      <td class="py-2 t-alert" x-text="c.reason"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- 无人工 IP 基准，保留系统识别依据供人工核验 -->
            <div x-show="compareTab==='unverified'" class="overflow-x-auto">
              <div x-show="comparison.unverified.length===0" class="text-center t-faint py-4 text-sm">无</div>
              <table class="data-table text-xs" x-show="comparison.unverified.length>0">
                <thead><tr>
                  <th class="text-left t-dim py-2 pr-2 font-medium">国际电路名</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">客户/用途</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">带宽</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">影响</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">路由</th>
                  <th class="text-left t-dim py-2 font-medium">核验说明</th>
                </tr></thead>
                <tbody>
                  <template x-for="(c,i) in comparison.unverified" :key="'uv'+i">
                    <tr>
                      <td class="py-2 pr-2 t-id" x-text="c.circuit_id || '—'"></td>
                      <td class="py-2 pr-2 t-secondary" x-text="c.customer || '—'"></td>
                      <td class="py-2 pr-2 font-medium t-warn whitespace-nowrap" x-text="c.bandwidth"></td>
                      <td class="py-2 pr-2 t-secondary" x-text="c.impact_status"></td>
                      <td class="py-2 pr-2 t-muted" x-text="c.routes.join(' / ') || '—'"></td>
                      <td class="py-2 t-dim" x-text="c.reason"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- 系统漏掉（含证据级原因分析）-->
            <div x-show="compareTab==='manual_only'" class="overflow-x-auto">
              <div x-show="comparison.manual_only.length===0" class="text-center t-faint py-4 text-sm">无</div>
              <table class="data-table text-xs" x-show="comparison.manual_only.length>0">
                <thead><tr>
                  <th class="text-left t-dim py-2 pr-2 font-medium">国际电路名</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">槽路表定位</th>
                  <th class="text-left t-dim py-2 font-medium">漏掉原因（以电路名回查槽路表）</th>
                </tr></thead>
                <tbody>
                  <template x-for="(c,i) in comparison.manual_only" :key="'mo'+i">
                    <tr style="vertical-align:top">
                      <td class="py-2 pr-2" style="min-width:150px">
                        <div class="t-id" x-text="c.circuit_id || '（电路名提取失败）'"></div>
                        <div class="t-faint" x-text="(c.customer||'') + ' ' + (c.bandwidth||'')"></div>
                      </td>
                      <td class="py-2 pr-2" style="min-width:130px">
                        <template x-if="c.found_in_source">
                          <div>
                            <span class="badge" :class="c.source_status==='开通' ? 'badge-normal' : 'badge-broken'"
                                  x-text="c.source_status || '状态空'"></span>
                            <span class="badge badge-iepl ml-1" x-text="c.source_type || '?'"></span>
                            <div class="t-dim mt-1" x-text="'路由：' + ((c.source_routes||[]).join(' / ') || '无')"></div>
                          </div>
                        </template>
                        <template x-if="!c.found_in_source">
                          <span class="badge badge-suspect">槽路表未找到</span>
                        </template>
                      </td>
                      <td class="py-2">
                        <div class="text-amber-strong font-semibold" x-text="c.cause"></div>
                        <div class="t-dim mt-0.5 leading-relaxed" x-text="c.detail"></div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- 一致 -->
            <div x-show="compareTab==='matched'" class="overflow-x-auto">
              <div x-show="comparison.matched.length===0" class="text-center t-faint py-4 text-sm">无</div>
              <table class="data-table text-xs" x-show="comparison.matched.length>0">
                <thead><tr>
                  <th class="text-left t-dim py-2 pr-2 font-medium">国际电路名</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">客户</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">带宽</th>
                  <th class="text-left t-dim py-2 pr-2 font-medium">系统状态</th>
                  <th class="text-left t-dim py-2 font-medium">人工状态</th>
                </tr></thead>
                <tbody>
                  <template x-for="(c,i) in comparison.matched" :key="'ma'+i">
                    <tr>
                      <td class="py-2 pr-2 t-id" x-text="c.circuit_id || '—'"></td>
                      <td class="py-2 pr-2 t-secondary" x-text="c.customer || '—'"></td>
                      <td class="py-2 pr-2 font-medium t-warn whitespace-nowrap" x-text="c.bandwidth"></td>
                      <td class="py-2 pr-2"><span class="badge" :class="impactBadgeClass(c.system_status)" x-text="c.system_status"></span></td>
                      <td class="py-2 t-muted" x-text="c.manual_status"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </div>

    </div>
  </div><!-- end grid -->
</div><!-- end main -->


<script>
function app() {
  return {
    // 状态
    cables: [],
    events: [],
    result: null,
    loading: false,
    copied: false,
    selectedStage: 'first_report',
    expandedTasks: [],
    stageForm: {},
    workflowSaving: false,
    workflowSaved: false,
    circuitTab: 'iepl',
    tooltip: { visible: false, x: 0, y: 0, name: '', route: '', direction: '', status: 'normal', fault_time: '' },
    form: { cable_id: '', fault_time: '' },
    // 数据源
    dataSource: null,
    uploading: false,
    uploadMsg: '',
    uploadOk: false,
    // 对比
    comparison: null,
    compareLoading: false,
    compareTab: 'system_only',

    // ── 初始化 ──────────────────────────────────────────────────────
    async init() {
      await this.loadState();
      await this.loadDataSource();
      // 默认时间：本地当前时间（避免 toISOString() 带来的时区偏移）
      this.form.fault_time = this.nowLocalInputValue();
      // 开发辅助：?auto=1 时自动载入最近一次故障的通报（用于无头截图）
      try {
        const params = new URLSearchParams(location.search);
        if (params.get('auto') && this.events.length) {
          await this.loadFaultReport(this.events[0].id);
          if (params.get('compare')) await this.loadComparison();
        }
      } catch (_) {}
    },

    // ── 数据源 ──────────────────────────────────────────────────────
    async loadDataSource() {
      try {
        const res = await fetch('/api/datasource');
        this.dataSource = await res.json();
      } catch (e) { /* ignore */ }
    },

    async uploadFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      this.uploading = true;
      this.uploadMsg = '';
      try {
        const fd = new FormData();
        fd.append('file', file);
        const res = await fetch('/api/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.error) {
          this.uploadOk = false;
          this.uploadMsg = '上传失败：' + data.error;
        } else {
          this.uploadOk = true;
          this.dataSource = data.datasource;
          this.uploadMsg = '上传成功，分析已切换到新槽路表：' + data.datasource.filename;
          // 新数据源生效，清空旧结果与对比
          this.result = null;
          this.comparison = null;
        }
      } catch (e) {
        this.uploadOk = false;
        this.uploadMsg = '上传出错：' + e;
      } finally {
        this.uploading = false;
        event.target.value = '';
      }
    },

    // ── 系统 vs 人工 对比 ──────────────────────────────────────────
    async loadComparison() {
      if (!this.result) return;
      this.compareLoading = true;
      this.comparison = null;
      try {
        const res = await fetch('/api/compare?cable_id=' + encodeURIComponent(this.result.cable_id));
        this.comparison = await res.json();
        this.compareTab = 'system_only';
      } catch (e) {
        this.comparison = { error: '对比失败：' + e };
      } finally {
        this.compareLoading = false;
      }
    },

    async loadState() {
      const res  = await fetch('/api/state');
      const data = await res.json();
      this.events = data.events || [];
      // 加载海缆列表
      const res2  = await fetch('/api/cables');
      this.cables = await res2.json();
      this.syncSvg();
    },

    // ── 故障录入 ────────────────────────────────────────────────────
    async submitFault() {
      if (!this.form.cable_id || !this.form.fault_time) return;
      this.loading = true;
      try {
        const res = await fetch('/api/fault', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cable_id: this.form.cable_id, fault_time: this.form.fault_time }),
        });
        const data = await res.json();
        if (data.error) { alert(data.error); return; }
        this.result = data;
        this.syncWorkflowSelection();
        this.comparison = null;
        this.events  = data.events || [];
        this.cables  = data.cables.map(s => {
          const info = this.cables.find(c => c.id === s.id) || {};
          return { ...info, ...s };
        });
        // 重新拉一次完整 cables 信息（含 label 等）
        const cablesRes = await fetch('/api/cables');
        this.cables = await cablesRes.json();
        this.syncSvg();
      } finally {
        this.loading = false;
      }
    },

    // ── 删除故障记录 ─────────────────────────────────────────────────
    async removeFault(eventId) {
      if (!confirm('确认删除这条故障记录吗？相关流程进度也会一并删除。')) return;
      const res  = await fetch(`/api/fault/${eventId}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      this.events = data.events || [];
      // 更新 cables 状态
      const cablesRes = await fetch('/api/cables');
      this.cables = await cablesRes.json();
      this.syncSvg();
      // 如果当前查看的记录已被删除，清空结果
      if (this.result) {
        const stillExists = this.events.find(e =>
          e.cable_id === this.result.cable_id && e.fault_time === this.result.fault_time
        );
        if (!stillExists) this.result = null;
      }
    },

    // ── 加载指定故障的通报 ──────────────────────────────────────────────
    async loadFaultReport(eventId) {
      this.loading = true;
      try {
        const url = `/api/analysis?event_id=${encodeURIComponent(eventId)}`;
        console.log('Loading fault report:', url);
        const res = await fetch(url);
        const data = await res.json();
        console.log('Received data:', {
          cable_id: data.cable_id,
          broken_ids: data.broken_ids,
          iepl_count: data.iepl?.length,
          ip_count: data.ip?.length
        });
        if (data.error) { alert(data.error); return; }
        data.event_id = eventId;  // 添加 event_id 用于高亮
        this.result = data;
        this.syncWorkflowSelection();
        this.comparison = null;
      } finally {
        this.loading = false;
      }
    },

    // ── SVG 态势图同步 ──────────────────────────────────────────────
    syncSvg() {
      this.cables.forEach(c => {
        const el = document.getElementById('seg-' + c.id);
        if (!el) return;
        el.classList.remove('normal', 'broken');
        el.classList.add(c.status === 'broken' ? 'broken' : 'normal');
      });
    },

    selectCable(id) {
      this.form.cable_id = id;
    },

    // ── 五阶段故障流程 ────────────────────────────────────────────────
    applicableWorkflowStages() {
      if (!this.result || !this.result.workflow) return [];
      return this.result.workflow.stages.filter(stage => stage.applicable);
    },

    currentWorkflowStage() {
      return this.applicableWorkflowStages().find(stage => stage.id === this.selectedStage)
        || this.applicableWorkflowStages()[0] || null;
    },

    syncWorkflowSelection() {
      const stages = this.applicableWorkflowStages();
      if (!stages.length) return;
      if (!stages.some(stage => stage.id === this.selectedStage)) {
        this.selectedStage = stages[0].id;
      }
      this.loadStageForm();
      const stage = this.currentWorkflowStage();
      const validTaskIds = stage
        ? stage.tasks.filter(task => this.taskHasReport(task)).map(task => task.id)
        : [];
      this.expandedTasks = this.expandedTasks.filter(taskId => validTaskIds.includes(taskId));
    },

    selectWorkflowStage(stageId) {
      this.selectedStage = stageId;
      this.workflowSaved = false;
      this.copied = false;
      this.loadStageForm();
      this.expandedTasks = [];
    },

    loadStageForm() {
      const stage = this.currentWorkflowStage();
      this.stageForm = stage ? { ...stage.fields } : {};
    },

    stageHasUnsavedChanges() {
      const stage = this.currentWorkflowStage();
      if (!stage) return false;
      return JSON.stringify(this.stageForm || {}) !== JSON.stringify(stage.fields || {});
    },

    workflowStatusLabel(status) {
      const labels = {
        not_started: '未开始', waiting: '等待信息', in_progress: '进行中',
        completed: '已完成', not_applicable: '不适用',
      };
      return labels[status] || status;
    },

    workflowStageClass(stage) {
      return {
        'is-active': this.selectedStage === stage.id,
        'is-completed': stage.status === 'completed',
        'is-progress': stage.status === 'in_progress',
        'is-waiting': stage.status === 'waiting' || stage.status === 'not_started',
      };
    },

    workflowStageHint(stage) {
      if (stage.status === 'completed' && !stage.ready) return '历史记录缺少本阶段信息，请补充并保存';
      if (stage.status === 'completed') return '本阶段所有传报渠道均已确认完成';
      if (!stage.previous_complete) return '请先完成前一个传报阶段';
      if (!stage.ready) return '等待信息到达并填写本阶段变量';
      return '文案已生成，实际传报后逐项确认';
    },

    async saveStageFields() {
      if (!this.result || !this.result.event_id) return;
      this.workflowSaving = true;
      this.workflowSaved = false;
      try {
        const res = await fetch(`/api/fault/${this.result.event_id}/workflow`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stage_id: this.selectedStage, fields: this.stageForm }),
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || '保存失败');
        this.result = data;
        this.events = data.events || this.events;
        this.syncWorkflowSelection();
        this.workflowSaved = true;
        setTimeout(() => this.workflowSaved = false, 2500);
      } catch (error) {
        alert(error.message || error);
      } finally {
        this.workflowSaving = false;
      }
    },

    async toggleWorkflowTask(task) {
      if (!this.result || !this.result.event_id) return;
      this.workflowSaving = true;
      try {
        const res = await fetch(`/api/fault/${this.result.event_id}/task`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            stage_id: this.selectedStage,
            channel_id: task.id,
            completed: !task.completed,
          }),
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || '状态保存失败');
        this.result = data;
        this.events = data.events || this.events;
        this.syncWorkflowSelection();
        const cablesRes = await fetch('/api/cables');
        this.cables = await cablesRes.json();
        this.syncSvg();
      } catch (error) {
        alert(error.message || error);
      } finally {
        this.workflowSaving = false;
      }
    },

    reportTextForTask(taskId) {
      if (!this.result || !this.result.reports || !this.result.reports.stages) return '';
      const reports = this.result.reports.stages[this.selectedStage] || {};
      return reports[taskId] || '';
    },

    taskHasReport(task) {
      return Boolean(task && this.reportTextForTask(task.id));
    },

    toggleTaskContent(task) {
      if (!this.taskHasReport(task)) return;
      this.copied = false;
      if (this.expandedTasks.includes(task.id)) {
        this.expandedTasks = this.expandedTasks.filter(taskId => taskId !== task.id);
      } else {
        this.expandedTasks = [...this.expandedTasks, task.id];
      }
    },

    // ── Tooltip ─────────────────────────────────────────────────────
    showTip(event, cableId) {
      const cable = this.cables.find(c => c.id === cableId);
      if (!cable) return;
      const svgRect = document.getElementById('cable-svg').getBoundingClientRect();
      const containerRect = event.target.closest('.relative').getBoundingClientRect();
      const x = event.clientX - containerRect.left + 10;
      const y = event.clientY - containerRect.top  + 10;
      const ev = this.events.find(e => e.cable_id === cableId);
      this.tooltip = {
        visible: true, x, y,
        name: `${cable.cable} 海缆 ${cable.segment} 段`,
        route: `路由：${cable.route_desc || ''}`,
        direction: `方向：${cable.direction || ''}方向`,
        status: cable.status,
        fault_time: ev ? this.formatTime(ev.fault_time) : '',
      };
    },

    hideTip() { this.tooltip.visible = false; },

    // ── 复制 ────────────────────────────────────────────────────────
    async copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        this.copied = true;
        setTimeout(() => this.copied = false, 2000);
      } catch {
        // 降级方案
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        this.copied = true;
        setTimeout(() => this.copied = false, 2000);
      }
    },

    // ── 下载 Excel ──────────────────────────────────────────────────
    async downloadExcel() {
      if (!this.result) return;
      const query = this.result.event_id
        ? `event_id=${encodeURIComponent(this.result.event_id)}`
        : `cable_id=${encodeURIComponent(this.result.cable_id)}&fault_time=${encodeURIComponent(this.result.fault_time)}`;
      const url = `/api/download?${query}`;
      try {
        const res = await fetch(url);
        if (!res.ok) {
          const error = await res.json().catch(() => ({}));
          throw new Error(error.error || `下载失败（${res.status}）`);
        }

        const disposition = res.headers.get('Content-Disposition') || '';
        const filenameMatch = disposition.match(/filename\*=UTF-8''([^;]+)/i);
        const filename = filenameMatch
          ? decodeURIComponent(filenameMatch[1])
          : '国际海缆故障影响业务统计表.xlsx';

        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objectUrl;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
      } catch (e) {
        alert(e.message || `下载失败：${e}`);
      }
    },

    async downloadSupervisorExcel(stageId) {
      if (!this.result || !this.result.event_id) return;
      const stage = this.currentWorkflowStage();
      if (!stage || !stage.ready || this.stageHasUnsavedChanges()) {
        alert('请先填写并保存本阶段信息，再下载专业主管文件。');
        return;
      }
      const url = `/api/supervisor-download?event_id=${encodeURIComponent(this.result.event_id)}&stage_id=${encodeURIComponent(stageId)}`;
      try {
        const res = await fetch(url);
        if (!res.ok) {
          const error = await res.json().catch(() => ({}));
          throw new Error(error.error || `下载失败（${res.status}）`);
        }
        const disposition = res.headers.get('Content-Disposition') || '';
        const filenameMatch = disposition.match(/filename\*=UTF-8''([^;]+)/i);
        const filename = filenameMatch
          ? decodeURIComponent(filenameMatch[1])
          : '专业主管传报文件.xlsx';
        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = objectUrl;
        link.download = filename;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
      } catch (error) {
        alert(error.message || error);
      }
    },

    nowLocalInputValue() {
      const d = new Date();
      d.setSeconds(0, 0);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${y}-${m}-${day}T${hh}:${mm}`;
    },

    // ── 工具函数 ─────────────────────────────────────────────────────
    cableLabel(id) {
      const c = this.cables.find(x => x.id === id);
      return c ? `${c.cable} ${c.segment}` : id;
    },

    eventIsResolved(event) {
      const tasks = event && event.workflow && event.workflow.tasks
        ? event.workflow.tasks.final_report : null;
      return !!tasks && Object.values(tasks).every(task => task.completed);
    },

    formatTime(t) {
      if (!t) return '';
      const d = new Date(t.replace('T', ' '));
      if (isNaN(d)) return t;
      return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    },

    formatDateTime(t) {
      if (!t) return '';
      return String(t).replace('T', ' ');
    },

    formatGbps(v) {
      if (v === undefined || v === null) return '--';
      if (v === 0) return '0G';
      if (v === Math.floor(v)) return v + 'G';
      // 去掉末尾无意义零
      return parseFloat(v.toFixed(4)) + 'G';
    },

    currentCircuits() {
      if (!this.result) return [];
      return this.circuitTab === 'iepl' ? this.result.iepl : this.result.ip;
    },

    impactBadgeClass(status) {
      const map = {
        '无保护':   'badge-broken',
        '主备双断':  'badge-broken',
        '主用':     'badge-primary',
        '备用':     'badge-backup',
      };
      return map[status] || 'badge-normal';
    },
  };
}
